# roles/aws_instance_from_template/defaults/main.yml
---

aws_region: "us-east-1"

# Nome lógico do template que queremos usar (chave do dicionário em vars/main.yml)
aws_template_name: "Kafka-cluster"

# Quantas instâncias subir a partir do template
aws_instance_count: 1

# Tipo da instância (pode ser ignorado se o Launch Template já definir)
aws_instance_type: "t3.medium"

# Sub-rede e security groups padrão (ajuste conforme seu VPC)
aws_subnet_id: ""
aws_security_group_ids: []

# Tags padrão
aws_instance_tags:
  Project: "Mulder-Scully"
  ManagedBy: "Ansible"
  Role: "{{ aws_template_name }}"
