---
- name: Execution Environment Factory - Build EE
  hosts: localhost
  gather_facts: false

  vars:
    builder_host: "{{ builder_host_input | default('192.168.15.20') }}"

    registry_host: "{{ registry_host_input | default('192.168.15.20:5000') }}"
    target_ee_name: "{{ ee_name_input | default('custom-ee') }}"
    target_ee_tag: "{{ ee_tag_input | default('1.0') }}"
    target_collections: "{{ collections_input | default(['community.general']) }}"
    target_image_full: "{{ registry_host }}/{{ target_ee_name }}:{{ target_ee_tag }}"

    target_base_image: "{{ target_base_image_input | default('registry.redhat.io/ansible-automation-platform-25/ee-minimal-rhel8:latest') }}"

    build_dir: "/tmp/{{ target_ee_name }}"
    build_log_file: "{{ build_dir }}/podman-build.log"
    push_log_file: "{{ build_dir }}/podman-push.log"

    ansible_builder_bin: "/opt/ee-builder-venv/bin/ansible-builder"
    podman_bin: "/usr/bin/podman"
    git_bin: "/usr/bin/git"

  tasks:
    - name: Show build parameters
      ansible.builtin.debug:
        msg:
          - "builder_host={{ builder_host }}"
          - "target_image_full={{ target_image_full }}"
          - "target_base_image={{ target_base_image }}"
          - "collections={{ target_collections }}"
          - "ansible_builder_bin={{ ansible_builder_bin }}"



    - name: Normalize collections input from survey or vars file
      ansible.builtin.set_fact:
        target_collections: >-
          {{
            collections_input
            if (collections_input is iterable and collections_input is not string)
            else
            (
              (collections_input | default('community.general')).splitlines()
              | map('trim')
              | reject('equalto', '')
              | list
            )
          }}

    - name: Show normalized collections
      ansible.builtin.debug:
        var: target_collections



        

    - name: Remove previous build directory on builder host
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: absent
      delegate_to: "{{ builder_host }}"

    - name: Ensure fresh build directory exists on builder host
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: "0755"
      delegate_to: "{{ builder_host }}"

    - name: Generate requirements.yml on builder host
      ansible.builtin.template:
        src: ../templates/requirements.yml.j2
        dest: "{{ build_dir }}/requirements.yml"
      delegate_to: "{{ builder_host }}"

    - name: Generate execution-environment.yml on builder host
      ansible.builtin.template:
        src: ../templates/execution-environment.yml.j2
        dest: "{{ build_dir }}/execution-environment.yml"
      delegate_to: "{{ builder_host }}"

    - name: Show execution-environment.yml
      ansible.builtin.command:
        cmd: cat "{{ build_dir }}/execution-environment.yml"
      register: ee_file
      changed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Display execution-environment.yml
      ansible.builtin.debug:
        var: ee_file.stdout_lines

    - name: Check ansible-builder binary exists on builder host
      ansible.builtin.command:
        cmd: ls -l "{{ ansible_builder_bin }}"
      register: ansible_builder_bin_check
      changed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Show ansible-builder binary path
      ansible.builtin.debug:
        var: ansible_builder_bin_check.stdout_lines

    - name: Check ansible-builder version on builder host
      ansible.builtin.command:
        cmd: "{{ ansible_builder_bin }} --version"
      register: ansible_builder_check
      changed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Show ansible-builder version
      ansible.builtin.debug:
        var: ansible_builder_check.stdout_lines

    - name: Check podman on builder host
      ansible.builtin.command:
        cmd: "{{ podman_bin }} --version"
      register: podman_check
      changed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Show podman version
      ansible.builtin.debug:
        var: podman_check.stdout_lines

    - name: Check git on builder host
      ansible.builtin.command:
        cmd: "{{ git_bin }} --version"
      register: git_check
      changed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Show git version
      ansible.builtin.debug:
        var: git_check.stdout_lines

    - name: Check login to Red Hat registry on builder host
      ansible.builtin.command:
        cmd: "{{ podman_bin }} login --get-login registry.redhat.io"
      register: rh_registry_login
      changed_when: false
      failed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Show Red Hat registry login status
      ansible.builtin.debug:
        msg:
          - "registry.redhat.io login rc={{ rh_registry_login.rc }}"
          - "stdout={{ rh_registry_login.stdout_lines | default([]) }}"
          - "stderr={{ rh_registry_login.stderr_lines | default([]) }}"

    - name: Generate build context with ansible-builder on builder host
      ansible.builtin.command:
        cmd: "{{ ansible_builder_bin }} create -f execution-environment.yml"
        chdir: "{{ build_dir }}"
      register: create_result
      delegate_to: "{{ builder_host }}"

    - name: Show create output
      ansible.builtin.debug:
        var: create_result.stdout_lines

    - name: Show create stderr
      ansible.builtin.debug:
        var: create_result.stderr_lines
      when: create_result.stderr_lines is defined

    - name: Show generated pip requirements
      ansible.builtin.command:
        cmd: cat "{{ build_dir }}/context/_build/requirements.txt"
      register: generated_pip_requirements_result
      changed_when: false
      failed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Display generated pip requirements
      ansible.builtin.debug:
        var: generated_pip_requirements_result.stdout_lines
      when: generated_pip_requirements_result.stdout_lines is defined

    - name: Show generated Containerfile
      ansible.builtin.command:
        cmd: cat "{{ build_dir }}/context/Containerfile"
      register: containerfile
      changed_when: false
      delegate_to: "{{ builder_host }}"

    - name: Display Containerfile
      ansible.builtin.debug:
        var: containerfile.stdout_lines

    - name: Remove previous build log
      ansible.builtin.file:
        path: "{{ build_log_file }}"
        state: absent
      delegate_to: "{{ builder_host }}"

    - name: Build EE on builder host
      ansible.builtin.shell: |
        set -o pipefail
        {{ podman_bin }} build \
          --tls-verify=false \
          --log-level=debug \
          -f context/Containerfile \
          -t {{ target_image_full }} \
          context 2>&1 | tee {{ build_log_file }}
      args:
        executable: /bin/bash
        chdir: "{{ build_dir }}"
      register: build_result
      delegate_to: "{{ builder_host }}"
      failed_when: false
      changed_when: true

    - name: Show build rc
      ansible.builtin.debug:
        msg: "build rc={{ build_result.rc }}"

    - name: Show build stdout
      ansible.builtin.debug:
        var: build_result.stdout_lines
      when: build_result.stdout_lines is defined

    - name: Show last 120 lines of build log
      ansible.builtin.command:
        cmd: tail -n 120 "{{ build_log_file }}"
      register: build_log_tail
      changed_when: false
      delegate_to: "{{ builder_host }}"
      when: build_result.rc != 0

    - name: Display last 120 lines of build log
      ansible.builtin.debug:
        var: build_log_tail.stdout_lines
      when: build_result.rc != 0

    - name: Fail if build failed
      ansible.builtin.fail:
        msg: "Falha no podman build. Veja o tail do log acima."
      when: build_result.rc != 0

    - name: Remove previous push log
      ansible.builtin.file:
        path: "{{ push_log_file }}"
        state: absent
      delegate_to: "{{ builder_host }}"

    - name: Push EE to registry from builder host
      ansible.builtin.shell: |
        set -o pipefail
        {{ podman_bin }} push \
          --tls-verify=false \
          {{ target_image_full }} 2>&1 | tee {{ push_log_file }}
      args:
        executable: /bin/bash
      register: push_result
      delegate_to: "{{ builder_host }}"
      failed_when: false
      changed_when: true

    - name: Show push rc
      ansible.builtin.debug:
        msg: "push rc={{ push_result.rc }}"

    - name: Show push stdout
      ansible.builtin.debug:
        var: push_result.stdout_lines
      when: push_result.stdout_lines is defined

    - name: Show last 80 lines of push log
      ansible.builtin.command:
        cmd: tail -n 80 "{{ push_log_file }}"
      register: push_log_tail
      changed_when: false
      delegate_to: "{{ builder_host }}"
      when: push_result.rc != 0

    - name: Display last 80 lines of push log
      ansible.builtin.debug:
        var: push_log_tail.stdout_lines
      when: push_result.rc != 0

    - name: Fail if push failed
      ansible.builtin.fail:
        msg: "Falha no podman push. Veja o tail do log acima."
      when: push_result.rc != 0

    - name: Final result
      ansible.builtin.debug:
        msg: "EE {{ target_image_full }} built and pushed successfully"


    - name: Create EE in AAP
      awx.awx.execution_environment:
      name: "{{ target_ee_name }}"
      image: "{{ target_image_full }}"
      organization: Default
      state: present
      validate_certs: false
      controller_host: https://192.168.15.20
      controller_username: admin
      controller_password: zaq1ZAQ!
