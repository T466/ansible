---
- name: Build Execution Environment
  hosts: localhost
  gather_facts: false

  vars:
    registry_host: "{{ registry_host_input | default('192.168.15.20:5000') }}"
    target_ee_name: "{{ ee_name_input | default('custom-ee') }}"
    target_ee_tag: "{{ ee_tag_input | default('1.0') }}"
    target_collections: "{{ collections_input | default(['community.general']) }}"
    target_image_full: "{{ registry_host }}/{{ target_ee_name }}:{{ target_ee_tag }}"

    builder_image: "{{ builder_image_input | default('192.168.15.20:5000/ee-builder:1.2') }}"

    ee_runtime_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
    ansible_builder_bin: "/usr/local/bin/ansible-builder"
    podman_bin: "/usr/bin/podman"
    git_bin: "/usr/bin/git"

    build_dir: "/tmp/{{ target_ee_name }}"
    build_log_file: "{{ build_dir }}/podman-build.log"
    push_log_file: "{{ build_dir }}/podman-push.log"

    podman_home: "{{ build_dir }}/home"
    podman_runroot: "{{ build_dir }}/run"
    podman_tmpdir: "{{ build_dir }}/tmp"

  tasks:
    - name: Create build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: "0755"

    - name: Create podman runtime directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ podman_home }}"
        - "{{ podman_runroot }}"
        - "{{ podman_tmpdir }}"

    - name: Generate requirements.yml
      ansible.builtin.template:
        src: ../templates/requirements.yml.j2
        dest: "{{ build_dir }}/requirements.yml"

    - name: Generate execution-environment.yml
      ansible.builtin.template:
        src: ../templates/execution-environment.yml.j2
        dest: "{{ build_dir }}/execution-environment.yml"

    - name: Show selected builder image
      ansible.builtin.debug:
        msg:
          - "builder_image={{ builder_image }}"
          - "target_image_full={{ target_image_full }}"
          - "build_dir={{ build_dir }}"
          - "HOME={{ podman_home }}"
          - "XDG_RUNTIME_DIR={{ podman_runroot }}"
          - "TMPDIR={{ podman_tmpdir }}"

    - name: Show generated execution-environment.yml
      ansible.builtin.command:
        cmd: cat "{{ build_dir }}/execution-environment.yml"
      register: generated_ee_file
      changed_when: false

    - name: Display generated execution-environment.yml
      ansible.builtin.debug:
        var: generated_ee_file.stdout_lines

    - name: Show PATH
      ansible.builtin.shell: 'echo "$PATH"'
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: ee_path
      changed_when: false

    - name: Check ansible-builder
      ansible.builtin.shell: |
        set -o pipefail
        command -v ansible-builder
        {{ ansible_builder_bin }} --version
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: ansible_builder_check
      changed_when: false
      failed_when: false

    - name: Check podman
      ansible.builtin.shell: |
        set -o pipefail
        command -v podman
        {{ podman_bin }} --version
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: podman_check
      changed_when: false
      failed_when: false

    - name: Check git
      ansible.builtin.shell: |
        set -o pipefail
        command -v git
        {{ git_bin }} --version
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: git_check
      changed_when: false
      failed_when: false

    - name: Show runtime info
      ansible.builtin.debug:
        msg:
          - "PATH={{ ee_path.stdout }}"
          - "ansible-builder rc={{ ansible_builder_check.rc }}"
          - "ansible-builder stdout={{ ansible_builder_check.stdout_lines | default([]) }}"
          - "ansible-builder stderr={{ ansible_builder_check.stderr_lines | default([]) }}"
          - "podman rc={{ podman_check.rc }}"
          - "podman stdout={{ podman_check.stdout_lines | default([]) }}"
          - "podman stderr={{ podman_check.stderr_lines | default([]) }}"
          - "git rc={{ git_check.rc }}"
          - "git stdout={{ git_check.stdout_lines | default([]) }}"
          - "git stderr={{ git_check.stderr_lines | default([]) }}"

    - name: Fail if ansible-builder is missing
      ansible.builtin.fail:
        msg: "ansible-builder não está disponível dentro do Execution Environment ee-builder"
      when: ansible_builder_check.rc != 0

    - name: Fail if podman is missing
      ansible.builtin.fail:
        msg: "podman não está disponível dentro do Execution Environment ee-builder"
      when: podman_check.rc != 0

    - name: Fail if git is missing
      ansible.builtin.fail:
        msg: "git não está disponível dentro do Execution Environment ee-builder"
      when: git_check.rc != 0

    - name: Reset podman rootless state
      ansible.builtin.command:
        cmd: "{{ podman_bin }} system migrate"
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: podman_migrate_result
      changed_when: false
      failed_when: false

    - name: Show podman migrate result
      ansible.builtin.debug:
        msg:
          - "podman system migrate rc={{ podman_migrate_result.rc }}"
          - "stdout={{ podman_migrate_result.stdout_lines | default([]) }}"
          - "stderr={{ podman_migrate_result.stderr_lines | default([]) }}"

    - name: Show podman info
      ansible.builtin.command:
        cmd: "{{ podman_bin }} info"
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: podman_info_result
      changed_when: false
      failed_when: false

    - name: Display podman info
      ansible.builtin.debug:
        var: podman_info_result.stdout_lines

    - name: Show local images before build
      ansible.builtin.command:
        cmd: "{{ podman_bin }} images"
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: podman_images_result
      changed_when: false

    - name: Display local images before build
      ansible.builtin.debug:
        var: podman_images_result.stdout_lines

    - name: Generate build context with ansible-builder
      ansible.builtin.command:
        cmd: "{{ ansible_builder_bin }} create -f execution-environment.yml"
        chdir: "{{ build_dir }}"
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: create_result

    - name: Show create stdout
      ansible.builtin.debug:
        var: create_result.stdout_lines

    - name: Show create stderr
      ansible.builtin.debug:
        var: create_result.stderr_lines
      when: create_result.stderr_lines is defined

    - name: Show generated Containerfile
      ansible.builtin.command:
        cmd: cat "{{ build_dir }}/context/Containerfile"
      register: containerfile_result
      changed_when: false

    - name: Display generated Containerfile
      ansible.builtin.debug:
        var: containerfile_result.stdout_lines

    - name: Remove previous build log
      ansible.builtin.file:
        path: "{{ build_log_file }}"
        state: absent

    - name: Build Execution Environment with podman
      ansible.builtin.shell: |
        set -o pipefail
        {{ podman_bin }} build \
          --tls-verify=false \
          -f context/Containerfile \
          -t {{ target_image_full }} \
          context 2>&1 | tee {{ build_log_file }}
      args:
        executable: /bin/bash
        chdir: "{{ build_dir }}"
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: build_result
      changed_when: true
      failed_when: false

    - name: Show build rc
      ansible.builtin.debug:
        msg: "podman build rc={{ build_result.rc }}"

    - name: Show build stdout
      ansible.builtin.debug:
        var: build_result.stdout_lines
      when: build_result.stdout_lines is defined

    - name: Show tail of build log
      ansible.builtin.command:
        cmd: tail -n 300 "{{ build_log_file }}"
      register: build_log_tail
      changed_when: false
      when: build_result.rc != 0

    - name: Display tail of build log
      ansible.builtin.debug:
        var: build_log_tail.stdout_lines
      when: build_result.rc != 0

    - name: Fail if podman build failed
      ansible.builtin.fail:
        msg: "Falha no podman build. Verifique o tail do log exibido acima."
      when: build_result.rc != 0

    - name: Remove previous push log
      ansible.builtin.file:
        path: "{{ push_log_file }}"
        state: absent

    - name: Push Execution Environment to local registry
      ansible.builtin.shell: |
        set -o pipefail
        {{ podman_bin }} push \
          --tls-verify=false \
          {{ target_image_full }} 2>&1 | tee {{ push_log_file }}
      args:
        executable: /bin/bash
      environment:
        PATH: "{{ ee_runtime_path }}"
        HOME: "{{ podman_home }}"
        XDG_RUNTIME_DIR: "{{ podman_runroot }}"
        TMPDIR: "{{ podman_tmpdir }}"
      register: push_result
      changed_when: true
      failed_when: false

    - name: Show push rc
      ansible.builtin.debug:
        msg: "podman push rc={{ push_result.rc }}"

    - name: Show push stdout
      ansible.builtin.debug:
        var: push_result.stdout_lines
      when: push_result.stdout_lines is defined

    - name: Show tail of push log
      ansible.builtin.command:
        cmd: tail -n 300 "{{ push_log_file }}"
      register: push_log_tail
      changed_when: false
      when: push_result.rc != 0

    - name: Display tail of push log
      ansible.builtin.debug:
        var: push_log_tail.stdout_lines
      when: push_result.rc != 0

    - name: Fail if podman push failed
      ansible.builtin.fail:
        msg: "Falha no podman push. Verifique o tail do log exibido acima."
      when: push_result.rc != 0

    - name: Show final result
      ansible.builtin.debug:
        msg: "EE {{ target_image_full }} built and pushed successfully"
