---
- name: Build Execution Environment
  hosts: localhost
  gather_facts: false

  vars:
    target_ee_name: "{{ ee_name_input | default('custom-ee') }}"
    target_ee_tag: "{{ ee_tag_input | default('1.0') }}"
    target_collections: "{{ collections_input | default(['community.general']) }}"

  tasks:
    - name: Create build directory
      ansible.builtin.file:
        path: "/tmp/{{ target_ee_name }}"
        state: directory

    - name: Generate requirements.yml
      ansible.builtin.template:
        src: ../templates/requirements.yml.j2
        dest: "/tmp/{{ target_ee_name }}/requirements.yml"

    - name: Generate execution-environment.yml
      ansible.builtin.template:
        src: ../templates/execution-environment.yml.j2
        dest: "/tmp/{{ target_ee_name }}/execution-environment.yml"

    - name: Build Execution Environment
      ansible.builtin.command:
        cmd: ansible-builder build -t {{ target_ee_name }}:{{ target_ee_tag }}
        chdir: "/tmp/{{ target_ee_name }}"

    - name: Show build result
      ansible.builtin.debug:
        msg: "EE {{ target_ee_name }}:{{ target_ee_tag }} built successfully"
