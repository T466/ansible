- name: Playbook unificado - Gerenciar servicos Linux) ou servico no Windows
  hosts: localhost
  gather_facts: false
  vars:
    system_type: "{{ system_type | default('linux') }}"
    target_list: "{{ target_hosts.split(',') }}"
  tasks:
    - name: Adicionar hosts dinamicamente - Linux
      add_host:
        name: "{{ item }}"
        groups: dinamico_linux
      loop: "{{ target_list }}"
      when: system_type == 'linux'

    - name: Adicionar hosts dinamicamente - Windows
      add_host:
        name: "{{ item }}"
        groups: dinamico_windows
      loop: "{{ target_list }}"
      when: system_type == 'windows'

- name: Gerenciar serviços - Linux ou Windows
  hosts: all
  gather_facts: false
  vars:
    itm_command_path: "/opt/IBM/ITM/bin/itmcmd"
    itm_agent_code: "lz"
    user_action: "{{ service_action | default('restart') }}"
    service_action_map:
      start: started
      stop: stopped
      restart: restarted
    service_action_mapped: "{{ service_action_map[user_action] | default('invalid') }}"
    service_name: "{{ service_name | default('Dynatrace OneAgent') }}"
  tasks:
    - name: Executar ITM - {{ user_action }}
      become: true
      command: >
        {{ itm_command_path }} agent {{ user_action }} {{ itm_agent_code }}
      register: result
      changed_when: "'completed' in result.stdout.lower() or result.rc == 0"
      when: "'dinamico_linux' in group_names"

    - name: Mostrar saída ITM
      debug:
        var: result.stdout
      when: "'dinamico_linux' in group_names"

    - name: Validar ação permitida para Windows
      assert:
        that:
          - service_action_mapped in ['started', 'stopped', 'restarted']
        fail_msg: "❌ Ação inválida: '{{ user_action }}'. Use apenas 'start', 'stop' ou 'restart'."
        success_msg: "✅ Ação '{{ user_action }}' validada e convertida para '{{ service_action_mapped }}'."
      when: "'dinamico_windows' in group_names"

    - name: "{{ service_action_mapped | capitalize }} serviço {{ service_name }}"
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: "{{ service_action_mapped }}"
      register: result
      when: "'dinamico_windows' in group_names"

    - name: Exibir resultado do Windows
      debug:
        var: result
      when: "'dinamico_windows' in group_names"