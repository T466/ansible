---
- name: Ler arquivo CSV do Google Drive pelo AAP
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    nome_arquivo: "ips_saida.csv"

    google_drive_api: "https://www.googleapis.com/drive/v3"

    query_csv: >-
      name = '{{ nome_arquivo }}' and trashed = false

    url_busca_csv: "{{ google_drive_api }}/files?q={{ query_csv | urlencode }}&fields={{ 'nextPageToken,files(id,name,mimeType,driveId)' | urlencode }}&pageSize=100&supportsAllDrives=true&includeItemsFromAllDrives=true"

  tasks:

    # ============================================
    # ETAPA 1 - VALIDAR CREDENCIAIS
    # ============================================

    - name: Validar credenciais OAuth2
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GOOGLE_CLIENT_ID') | length > 0
          - lookup('ansible.builtin.env', 'GOOGLE_CLIENT_SECRET') | length > 0
          - lookup('ansible.builtin.env', 'GOOGLE_REFRESH_TOKEN') | length > 0
        success_msg: "OK - Credenciais OAuth2 disponiveis."
        fail_msg: "ERRO - Credenciais OAuth2 nao disponiveis."

    # ============================================
    # ETAPA 2 - OBTER ACCESS TOKEN
    # ============================================

    - name: Obter Access Token
      ansible.builtin.uri:
        url: "https://oauth2.googleapis.com/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ lookup('ansible.builtin.env', 'GOOGLE_CLIENT_ID') }}"
          client_secret: "{{ lookup('ansible.builtin.env', 'GOOGLE_CLIENT_SECRET') }}"
          refresh_token: "{{ lookup('ansible.builtin.env', 'GOOGLE_REFRESH_TOKEN') }}"
          grant_type: refresh_token
        status_code: 200
        return_content: true
        timeout: 30
      register: oauth_response
      no_log: true

    - name: Confirmar autenticacao OAuth2
      ansible.builtin.debug:
        msg: "OK - Access Token obtido com sucesso."

    # ============================================
    # ETAPA 3 - PROCURAR CSV NO GOOGLE DRIVE
    # ============================================

    - name: Procurar ips.csv no Google Drive
      ansible.builtin.uri:
        url: "{{ url_busca_csv }}"
        method: GET
        headers:
          Authorization: "Bearer {{ oauth_response.json.access_token }}"
          Accept: "application/json"
        return_content: true
        status_code: 200
        timeout: 30
      register: search_response
      failed_when: false
      no_log: true

    # ============================================
    # ETAPA 4 - DIAGNOSTICAR BUSCA
    # ============================================

    - name: Diagnosticar busca do CSV
      ansible.builtin.debug:
        msg:
          - "HTTP Status: {{ search_response.status | default('indisponivel') }}"
          - "Mensagem tecnica: {{ search_response.msg | default('nao informada') }}"
          - "Erro Google: {{ search_response.json.error.status | default('nao informado') }}"
          - "Mensagem Google: {{ search_response.json.error.message | default('nao informada') }}"
          - "Arquivos encontrados: {{ search_response.json.files | default([]) | length }}"

    - name: Validar consulta Google Drive
      ansible.builtin.assert:
        that:
          - search_response.status | default(0) | int == 200
        success_msg: "OK - Consulta ao Google Drive realizada."
        fail_msg: "ERRO - Falha ao consultar Google Drive."

    # ============================================
    # ETAPA 5 - LOCALIZAR ARQUIVO
    # ============================================

    - name: Validar existencia do CSV
      ansible.builtin.assert:
        that:
          - search_response.json.files | default([]) | length > 0
        success_msg: "OK - Arquivo ips.csv localizado."
        fail_msg: "ERRO - Arquivo ips.csv nao encontrado."

    - name: Exibir arquivos encontrados
      ansible.builtin.debug:
        msg: "{{ search_response.json.files }}"

    - name: Selecionar arquivo CSV
      ansible.builtin.set_fact:
        arquivo_csv: "{{ search_response.json.files[0] }}"

    - name: Exibir arquivo selecionado
      ansible.builtin.debug:
        msg:
          - "Nome: {{ arquivo_csv.name }}"
          - "ID: {{ arquivo_csv.id }}"
          - "MIME Type: {{ arquivo_csv.mimeType }}"

    # ============================================
    # ETAPA 6 - VALIDAR FORMATO
    # ============================================

    - name: Validar formato do arquivo
      ansible.builtin.assert:
        that:
          - arquivo_csv.mimeType in
            ['text/csv', 'application/vnd.google-apps.spreadsheet']
        fail_msg: "ERRO - O arquivo nao e CSV nem Google Sheets."
        success_msg: "OK - Formato de arquivo suportado."

    # ============================================
    # ETAPA 7 - LER CSV ORIGINAL
    # ============================================

    - name: Baixar conteudo do CSV
      ansible.builtin.uri:
        url: "{{ google_drive_api }}/files/{{ arquivo_csv.id }}?alt=media&supportsAllDrives=true"
        method: GET
        headers:
          Authorization: "Bearer {{ oauth_response.json.access_token }}"
        return_content: true
        status_code: 200
        timeout: 30
      register: csv_response
      no_log: true
      when: arquivo_csv.mimeType == 'text/csv'

    # ============================================
    # ETAPA 8 - EXPORTAR GOOGLE SHEETS
    # ============================================

    - name: Exportar Google Sheets como CSV
      ansible.builtin.uri:
        url: "{{ google_drive_api }}/files/{{ arquivo_csv.id }}/export?mimeType=text%2Fcsv"
        method: GET
        headers:
          Authorization: "Bearer {{ oauth_response.json.access_token }}"
        return_content: true
        status_code: 200
        timeout: 30
      register: sheets_response
      no_log: true
      when: arquivo_csv.mimeType == 'application/vnd.google-apps.spreadsheet'

    # ============================================
    # ETAPA 9 - PREPARAR CONTEUDO
    # ============================================

    - name: Definir conteudo do CSV original
      ansible.builtin.set_fact:
        conteudo_csv: "{{ csv_response.content }}"
      no_log: true
      when: arquivo_csv.mimeType == 'text/csv'

    - name: Definir conteudo exportado do Sheets
      ansible.builtin.set_fact:
        conteudo_csv: "{{ sheets_response.content }}"
      no_log: true
      when: arquivo_csv.mimeType == 'application/vnd.google-apps.spreadsheet'

    # ============================================
    # ETAPA 10 - EXIBIR DADOS
    # ============================================

    - name: Exibir conteudo do CSV
      ansible.builtin.debug:
        msg: "{{ conteudo_csv.splitlines() }}"

    - name: Exibir quantidade de registros
      ansible.builtin.debug:
        msg: >-
          Total de registros:
          {{ (conteudo_csv.splitlines() | length) - 1 }}

    # ============================================
    # ETAPA 11 - FINALIZAR
    # ============================================

    - name: Finalizar teste
      ansible.builtin.debug:
        msg: "OK - Arquivo ips.csv lido com sucesso pelo AAP."
