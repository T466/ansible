---
- name: Ler arquivo CSV do Google Drive pelo AAP
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Validar credenciais OAuth2
      ansible.builtin.assert:
        that:
          - lookup('env', 'GOOGLE_CLIENT_ID') | length > 0
          - lookup('env', 'GOOGLE_CLIENT_SECRET') | length > 0
          - lookup('env', 'GOOGLE_REFRESH_TOKEN') | length > 0
        success_msg: "Credenciais OAuth2 disponiveis."

    - name: Obter Access Token
      ansible.builtin.uri:
        url: https://oauth2.googleapis.com/token
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ lookup('env', 'GOOGLE_CLIENT_ID') }}"
          client_secret: "{{ lookup('env', 'GOOGLE_CLIENT_SECRET') }}"
          refresh_token: "{{ lookup('env', 'GOOGLE_REFRESH_TOKEN') }}"
          grant_type: refresh_token
        status_code: 200
      register: oauth_response
      no_log: true

    - name: Procurar ips.csv no Google Drive
      ansible.builtin.uri:
        url: https://www.googleapis.com/drive/v3/files
        method: GET
        headers:
          Authorization: "Bearer {{ oauth_response.json.access_token }}"
        params:
          q: "name = 'ips.csv' and trashed = false"
          fields: "nextPageToken,files(id,name,mimeType)"
          pageSize: "100"
        return_content: true
        status_code: 200
      register: search_response
      no_log: true

    - name: Exibir arquivos encontrados
      ansible.builtin.debug:
        msg: "{{ search_response.json.files | default([]) }}"

    - name: Validar arquivo encontrado
      ansible.builtin.assert:
        that:
          - search_response.json.files | length > 0
        fail_msg: "Arquivo ips.csv nao encontrado."
        success_msg: "Arquivo ips.csv localizado."

    - name: Definir ID do arquivo
      ansible.builtin.set_fact:
        arquivo_id: "{{ search_response.json.files[0].id }}"

    - name: Baixar conteudo do CSV
      ansible.builtin.uri:
        url: "https://www.googleapis.com/drive/v3/files/{{ arquivo_id }}?alt=media"
        method: GET
        headers:
          Authorization: "Bearer {{ oauth_response.json.access_token }}"
        return_content: true
        status_code: 200
      register: csv_response
      no_log: true

    - name: Exibir conteudo do CSV
      ansible.builtin.debug:
        msg: "{{ csv_response.content.splitlines() }}"

    - name: Finalizar teste
      ansible.builtin.debug:
        msg: "Leitura do CSV realizada com sucesso."
