---
- name: Testar integracao AAP com Google Drive
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ============================================
    # ETAPA 1 - VALIDAR CREDENCIAIS OAUTH2
    # ============================================

    - name: Diagnosticar variaveis OAuth2
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'GOOGLE_CLIENT_ID') | length > 0
          - lookup('ansible.builtin.env', 'GOOGLE_CLIENT_SECRET') | length > 0
          - lookup('ansible.builtin.env', 'GOOGLE_REFRESH_TOKEN') | length > 0
        fail_msg: "ERRO - Variaveis OAuth2 nao disponiveis."
        success_msg: "OK - As tres variaveis OAuth2 estao disponiveis."

    # ============================================
    # ETAPA 2 - OBTER ACCESS TOKEN
    # ============================================

    - name: Obter Access Token
      ansible.builtin.uri:
        url: "https://oauth2.googleapis.com/token"
        method: POST
        body_format: form-urlencoded
        body:
          client_id: "{{ lookup('ansible.builtin.env', 'GOOGLE_CLIENT_ID') }}"
          client_secret: "{{ lookup('ansible.builtin.env', 'GOOGLE_CLIENT_SECRET') }}"
          refresh_token: "{{ lookup('ansible.builtin.env', 'GOOGLE_REFRESH_TOKEN') }}"
          grant_type: refresh_token
        status_code: 200
        return_content: true
        timeout: 30
      register: oauth_response
      failed_when: false
      no_log: true

    # ============================================
    # ETAPA 3 - DIAGNOSTICAR AUTENTICACAO
    # ============================================

    - name: Diagnosticar resposta HTTP do Google
      ansible.builtin.debug:
        msg:
          - "HTTP Status: {{ oauth_response.status | default('indisponivel') }}"
          - "Erro OAuth: {{ oauth_response.json.error | default('nao informado') }}"
          - "Tipo de falha: {{ 'HTTP' if (oauth_response.status | default(0) | int) > 0 else 'Conexao ou execucao' }}"

    - name: Validar autenticacao OAuth2
      ansible.builtin.assert:
        that:
          - oauth_response.status | default(0) | int == 200
          - oauth_response.json.access_token is defined
          - oauth_response.json.access_token | length > 0
        fail_msg: "ERRO - Falha na autenticacao OAuth2."
        success_msg: "OK - Access Token obtido com sucesso."
      no_log: true

    - name: Confirmar autenticacao OAuth2
      ansible.builtin.debug:
        msg: "OK - Autenticacao OAuth2 realizada com sucesso."

    # ============================================
    # ETAPA 4 - CONSULTAR GOOGLE DRIVE API
    # ============================================

    - name: Consultar arquivos no Google Drive
      ansible.builtin.uri:
        url: "https://www.googleapis.com/drive/v3/files"
        method: GET
        headers:
          Authorization: "Bearer {{ oauth_response.json.access_token }}"
          Accept: "application/json"
        status_code:
          - 200
          - 400
          - 401
          - 403
        return_content: true
        timeout: 30
      register: drive_response
      failed_when: false
      no_log: true

    # ============================================
    # ETAPA 5 - DIAGNOSTICAR ERRO GOOGLE DRIVE
    # ============================================

    - name: Diagnosticar resposta Google Drive
      ansible.builtin.debug:
        msg:
          - "HTTP Status: {{ drive_response.status | default('indisponivel') }}"
          - "Codigo do erro: {{ drive_response.json.error.code | default('nao informado') }}"
          - "Status do erro: {{ drive_response.json.error.status | default('nao informado') }}"
          - "Mensagem do Google: {{ drive_response.json.error.message | default('nao informada') }}"
          - "Arquivos encontrados: {{ drive_response.json.files | default([]) | length }}"

    # ============================================
    # ETAPA 6 - VALIDAR CONSULTA GOOGLE DRIVE
    # ============================================

    - name: Validar consulta Google Drive
      ansible.builtin.assert:
        that:
          - drive_response.status | default(0) | int == 200
        fail_msg: "ERRO - Falha ao consultar Google Drive. Verifique o diagnostico acima."
        success_msg: "OK - Google Drive API acessada com sucesso."

    # ============================================
    # ETAPA 7 - EXIBIR ARQUIVOS
    # ============================================

    - name: Exibir arquivos encontrados
      ansible.builtin.debug:
        msg: "{{ drive_response.json.files | default([]) }}"

    # ============================================
    # ETAPA 8 - FINALIZAR
    # ============================================

    - name: Finalizar teste
      ansible.builtin.debug:
        msg: "OK - Integracao AAP com Google Drive executada com sucesso."
