- name: "SUSE15 | Listar unit files do systemd relacionados ao Zabbix"
  ansible.builtin.shell: "systemctl list-unit-files --no-pager | awk '{print $1}' | grep -i '^zabbix' || true"
  register: zabbix_units
  changed_when: false
  failed_when: false

- name: "SUSE15 | Definir serviço do Zabbix Agent (FORÇAR autodetecção)"
  ansible.builtin.set_fact:
    zabbix_agent_service_name_detected: >-
      {% if 'zabbix-agent2.service' in zabbix_units.stdout_lines %}zabbix-agent2
      {% elif 'zabbix-agent.service' in zabbix_units.stdout_lines %}zabbix-agent
      {% elif 'zabbix_agentd.service' in zabbix_units.stdout_lines %}zabbix_agentd
      {% else %}{% endif %}

- name: "SUSE15 | Falhar se não foi possível detectar unit do Zabbix"
  ansible.builtin.fail:
    msg: >-
      Não encontrei unit do Zabbix Agent no systemd.
      Units encontradas: {{ zabbix_units.stdout_lines | default([]) }}
      Pacotes Zabbix instalados: (rode) rpm -qa | grep -i zabbix
  when: zabbix_agent_service_name_detected is not defined or (zabbix_agent_service_name_detected | length == 0)

- name: "SUSE15 | Validar que o unit detectado realmente existe"
  ansible.builtin.shell: "systemctl status {{ zabbix_agent_service_name_detected }} >/dev/null 2>&1"
  register: zabbix_unit_status
  changed_when: false
  failed_when: zabbix_unit_status.rc != 0

- name: "SUSE15 | Habilitar e iniciar Zabbix Agent (usando o unit detectado)"
  ansible.builtin.service:
    name: "{{ zabbix_agent_service_name_detected }}"
    state: started
    enabled: yes
  become: yes
