---
# openSUSE Leap 15.x
# Instala Zabbix Agent direto por RPM (sem repo zabbix-release),
# resolve locks do PackageKit, remove CD-ROM e sobe o serviço correto.

# ------------------------------------------------------------
# (0) Mostrar SO
# ------------------------------------------------------------
- name: "SUSE | Mostrar distribuição"
  ansible.builtin.shell: |
    . /etc/os-release
    echo "$PRETTY_NAME"
  register: _os
  changed_when: false

- ansible.builtin.debug:
    var: _os.stdout

# ------------------------------------------------------------
# (1) Parar e bloquear PackageKit (lock do zypper)
# ------------------------------------------------------------
- name: "SUSE | Parar PackageKit e liberar lock"
  ansible.builtin.shell: |
    systemctl stop packagekit.service 2>/dev/null || true
    pkill -f /usr/lib/packagekitd 2>/dev/null || true

    for i in $(seq 1 20); do
      if ! pgrep -f /usr/lib/packagekitd >/dev/null 2>&1; then
        exit 0
      fi
      sleep 1
    done

    echo "PackageKit ainda ativo"
    pgrep -a -f /usr/lib/packagekitd || true
    exit 1
  become: yes
  changed_when: false

- name: "SUSE | Desabilitar PackageKit (evitar lock durante automação)"
  ansible.builtin.shell: |
    systemctl disable --now packagekit.service 2>/dev/null || true
    systemctl mask packagekit.service 2>/dev/null || true
  become: yes
  changed_when: false

# ------------------------------------------------------------
# (2) Remover repositórios CD-ROM (ISO)
# ------------------------------------------------------------
- name: "SUSE | Remover repositórios CD-ROM"
  ansible.builtin.shell: |
    zypper -x lr -u | awk -F'[<>]' '
      /<repo /{a=""}
      /<alias>/{a=$3}
      /<url>cd:/{print a}
    ' | while read a; do
      zypper -n rr "$a" || true
    done
  become: yes
  changed_when: false

# ------------------------------------------------------------
# (3) Garantir curl ou wget
# ------------------------------------------------------------
- name: "SUSE | Garantir ferramenta de download"
  ansible.builtin.shell: |
    if command -v curl >/dev/null 2>&1 || command -v wget >/dev/null 2>&1; then
      exit 0
    fi
    zypper -n refresh
    zypper -n in -y curl || zypper -n in -y wget
  become: yes
  changed_when: false

# ------------------------------------------------------------
# (4) Descobrir RPM mais recente do Zabbix Agent2 (6.0 LTS)
# ------------------------------------------------------------
- name: "SUSE | Descobrir URL do RPM zabbix-agent2"
  ansible.builtin.shell: |
    base="https://repo.zabbix.com/zabbix/6.0/sles/15/x86_64/"

    if command -v curl >/dev/null 2>&1; then
      html="$(curl -fsSL "$base")"
    else
      html="$(wget -qO- "$base")"
    fi

    echo "$html" \
      | grep -oE 'zabbix-agent2-[^"]+\.sles15\.x86_64\.rpm' \
      | sort -V \
      | tail -n 1 \
      | awk -v b="$base" '{print b $1}'
  register: _agent2_url
  changed_when: false

# ------------------------------------------------------------
# (5) Baixar e instalar Agent2
# ------------------------------------------------------------
- name: "SUSE | Baixar RPM zabbix-agent2"
  ansible.builtin.shell: |
    url="{{ _agent2_url.stdout }}"
    test -n "$url"
    out="/tmp/zabbix-agent2.rpm"

    if command -v curl >/dev/null 2>&1; then
      curl -fsSL "$url" -o "$out"
    else
      wget -qO "$out" "$url"
    fi

    echo "$out"
  register: _agent2_rpm
  become: yes
  changed_when: false

- name: "SUSE | Instalar zabbix-agent2 via zypper"
  ansible.builtin.command: "zypper -n in -y --allow-unsigned-rpm {{ _agent2_rpm.stdout }}"
  register: _install_agent2
  become: yes
  failed_when: false

# ------------------------------------------------------------
# (6) Fallback Agent1 se Agent2 falhar
# ------------------------------------------------------------
- name: "SUSE | Descobrir URL do RPM zabbix-agent (fallback)"
  ansible.builtin.shell: |
    base="https://repo.zabbix.com/zabbix/6.0/sles/15/x86_64/"

    if command -v curl >/dev/null 2>&1; then
      html="$(curl -fsSL "$base")"
    else
      html="$(wget -qO- "$base")"
    fi

    echo "$html" \
      | grep -oE 'zabbix-agent-[^"]+\.sles15\.x86_64\.rpm' \
      | sort -V \
      | tail -n 1 \
      | awk -v b="$base" '{print b $1}'
  register: _agent1_url
  when: _install_agent2.rc != 0
  changed_when: false

- name: "SUSE | Baixar RPM zabbix-agent (fallback)"
  ansible.builtin.shell: |
    url="{{ _agent1_url.stdout }}"
    test -n "$url"
    out="/tmp/zabbix-agent.rpm"

    if command -v curl >/dev/null 2>&1; then
      curl -fsSL "$url" -o "$out"
    else
      wget -qO "$out" "$url"
    fi

    echo "$out"
  register: _agent1_rpm
  become: yes
  when: _install_agent2.rc != 0
  changed_when: false

- name: "SUSE | Instalar zabbix-agent (fallback)"
  ansible.builtin.command: "zypper -n in -y --allow-unsigned-rpm {{ _agent1_rpm.stdout }}"
  register: _install_agent1
  become: yes
  when: _install_agent2.rc != 0
  failed_when: false

- name: "SUSE | Falhar se nenhum agente instalou"
  ansible.builtin.fail:
    msg: |
      Falha ao instalar Zabbix Agent no SUSE.
      agent2 rc={{ _install_agent2.rc }} stderr={{ _install_agent2.stderr | default('') }}
      agent1 rc={{ (_install_agent1.rc if _install_agent1 is defined else 'N/A') }}
  when: _install_agent2.rc != 0 and (_install_agent1 is not defined or _install_agent1.rc != 0)

# ------------------------------------------------------------
# (7) Descobrir unit systemd e iniciar serviço
# ------------------------------------------------------------
- name: "SUSE | Descobrir unit do Zabbix"
  ansible.builtin.shell: |
    systemctl list-unit-files --no-pager \
      | awk '{print $1}' \
      | grep -iE '^zabbix(-agent2|-agent|_agentd)\.service$' || true
  register: _units
  changed_when: false

- name: "SUSE | Falhar se não houver unit"
  ansible.builtin.fail:
    msg: "Nenhum unit Zabbix encontrado após instalação. Units: {{ _units.stdout_lines }}"
  when: (_units.stdout_lines | length) == 0

- name: "SUSE | Selecionar serviço"
  ansible.builtin.set_fact:
    _zabbix_service: "{{ (_units.stdout_lines | first) | regex_replace('\\.service$', '') }}"

- name: "SUSE | Habilitar e iniciar serviço"
  ansible.builtin.command: "systemctl enable --now {{ _zabbix_service }}"
  become: yes
