- name: "SUSE15 | Descobrir serviço do Zabbix Agent via systemctl"
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-unit-files --no-pager | awk '{print $1}' | grep -iE '^zabbix(-agent2|-agent|_agentd)\.service$' || true
  register: zabbix_agent_units
  changed_when: false
  failed_when: false

- name: "SUSE15 | Falhar se não existir nenhum unit do Zabbix Agent"
  ansible.builtin.fail:
    msg: >-
      Nenhum unit do Zabbix Agent encontrado.
      Units retornadas: {{ zabbix_agent_units.stdout_lines | default([]) }}
      Verifique se o pacote foi instalado e se o repositório do Zabbix está disponível.
  when: zabbix_agent_units.stdout_lines | default([]) | length == 0

- name: "SUSE15 | Escolher unit (prioriza agent2)"
  ansible.builtin.set_fact:
    zabbix_agent_service_name_detected: >-
      {% if 'zabbix-agent2.service' in zabbix_agent_units.stdout_lines %}zabbix-agent2
      {% elif 'zabbix-agent.service' in zabbix_agent_units.stdout_lines %}zabbix-agent
      {% elif 'zabbix_agentd.service' in zabbix_agent_units.stdout_lines %}zabbix_agentd
      {% else %}{% endif %}

- name: "SUSE15 | Habilitar e iniciar Zabbix Agent"
  ansible.builtin.service:
    name: "{{ zabbix_agent_service_name_detected }}"
    state: started
    enabled: yes
  become: yes
