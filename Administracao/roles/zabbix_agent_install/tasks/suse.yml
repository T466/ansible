---
# SUSE Linux Enterprise 15 / openSUSE Leap 15
# Zabbix Agent installation and service management (robust version)

- name: "SUSE | Mostrar distribuição"
  ansible.builtin.debug:
    msg: "SUSE detectado: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

# -------------------------------------------------------------------
# Instalação do pacote
# -------------------------------------------------------------------

- name: "SUSE | Definir pacote preferido do Zabbix Agent (default: agent2)"
  ansible.builtin.set_fact:
    _zabbix_pkg_preferido: "{{ zabbix_agent_pkg_suse | default('zabbix-agent2') }}"

- name: "SUSE | Instalar pacote preferido"
  ansible.builtin.package:
    name: "{{ _zabbix_pkg_preferido }}"
    state: present
  become: yes
  register: _pkg_try
  failed_when: false

- name: "SUSE | Fallback: instalar zabbix-agent (agent1) se o preferido falhar"
  ansible.builtin.package:
    name: "zabbix-agent"
    state: present
  become: yes
  when: _pkg_try is failed

# -------------------------------------------------------------------
# Diagnóstico de pacotes instalados
# -------------------------------------------------------------------

- name: "SUSE | Listar pacotes Zabbix instalados"
  ansible.builtin.shell: "rpm -qa | grep -i '^zabbix' || true"
  register: _zabbix_pkgs
  changed_when: false
  failed_when: false

- name: "SUSE | Debug pacotes Zabbix"
  ansible.builtin.debug:
    var: _zabbix_pkgs.stdout_lines

# -------------------------------------------------------------------
# Descoberta REAL do unit do systemd
# -------------------------------------------------------------------

- name: "SUSE | Descobrir unit do Zabbix Agent no systemd"
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-unit-files --no-pager | awk '{print $1}' | \
      grep -iE '^zabbix(-agent2|-agent|_agentd)\.service$' || true
  register: _zabbix_units
  changed_when: false
  failed_when: false

- name: "SUSE | Debug units encontradas"
  ansible.builtin.debug:
    var: _zabbix_units.stdout_lines

# -------------------------------------------------------------------
# Validações fortes (fail-fast)
# -------------------------------------------------------------------

- name: "SUSE | Falhar se nenhum unit do Zabbix Agent for encontrado"
  ansible.builtin.fail:
    msg: >-
      Nenhum unit do Zabbix Agent encontrado no systemd.
      Units retornadas: {{ _zabbix_units.stdout_lines | default([]) }}
      Pacotes Zabbix instalados: {{ _zabbix_pkgs.stdout_lines | default([]) }}
      Verifique repositório/pacote do Zabbix para SUSE 15.
  when: (_zabbix_units.stdout_lines | default([]) | length) == 0

# -------------------------------------------------------------------
# Seleção segura do serviço (sem chute)
# -------------------------------------------------------------------

- name: "SUSE | Selecionar unit do Zabbix Agent"
  ansible.builtin.set_fact:
    _zabbix_unit_file: "{{ (_zabbix_units.stdout_lines | first) }}"

- name: "SUSE | Derivar nome do serviço a partir do unit"
  ansible.builtin.set_fact:
    _zabbix_service: "{{ _zabbix_unit_file | regex_replace('\\.service$', '') }}"

# -------------------------------------------------------------------
# Ativação do serviço
# -------------------------------------------------------------------

- name: "SUSE | Habilitar e iniciar Zabbix Agent"
  ansible.builtin.service:
    name: "{{ _zabbix_service }}"
    state: started
    enabled: yes
  become: yes
