---
# openSUSE Leap 15.6 / SUSE-like
# Instala e sobe Zabbix Agent com auto-habilitação de repositórios

- name: "SUSE | Mostrar distribuição"
  ansible.builtin.debug:
    msg: "SUSE detectado: {{ ansible_distribution }} {{ ansible_distribution_major_version }}"

# -------------------------------------------------------------------
# (A) Remover repo CD-ROM (muito comum em VM/ISO)
# -------------------------------------------------------------------
- name: "SUSE | Remover repo do CD-ROM (opcional)"
  ansible.builtin.command: "zypper -n rr {{ suse_cdrom_repo_alias | default('openSUSE-Leap-15.6-1') }}"
  become: yes
  register: _rr_cdrom
  changed_when: _rr_cdrom.rc == 0
  failed_when: false
  when: suse_remove_cdrom_repo | default(true)

# -------------------------------------------------------------------
# (B) Adicionar repo do Zabbix (zabbix-release)
# -------------------------------------------------------------------
# Escolha uma versão LTS. Ex.: 6.0 LTS (recomendado).
- name: "SUSE | Definir URL do zabbix-release (opcional)"
  ansible.builtin.set_fact:
    zabbix_repo_release_rpm_url_suse: >-
      {{ zabbix_repo_release_rpm_url_suse
         | default('https://repo.zabbix.com/zabbix/6.0/opensuse/15/x86_64/zabbix-release-6.0-4.el15.noarch.rpm') }}

- name: "SUSE | Instalar zabbix-release (habilitar repo oficial Zabbix)"
  ansible.builtin.package:
    name: "{{ zabbix_repo_release_rpm_url_suse }}"
    state: present
  become: yes
  register: _zabbix_release
  when: zabbix_repo_enable_suse | default(true)

- name: "SUSE | Refresh repositórios"
  ansible.builtin.command: "zypper -n refresh"
  become: yes
  register: _zypper_refresh
  changed_when: false

# -------------------------------------------------------------------
# (C) Instalar Zabbix Agent (agent2 preferido, fallback agent1)
# -------------------------------------------------------------------
- name: "SUSE | Tentar instalar zabbix-agent2 (preferido)"
  ansible.builtin.package:
    name: "zabbix-agent2"
    state: present
  become: yes
  register: _try_agent2
  failed_when: false

- name: "SUSE | Tentar instalar zabbix-agent (fallback)"
  ansible.builtin.package:
    name: "zabbix-agent"
    state: present
  become: yes
  register: _try_agent1
  failed_when: false
  when: _try_agent2 is failed

- name: "SUSE | Falhar se nenhum pacote pôde ser instalado (mostra erro real)"
  ansible.builtin.fail:
    msg: >-
      Falha ao instalar Zabbix Agent no SUSE.
      zabbix-agent2 result: {{ _try_agent2 }}
      zabbix-agent result: {{ _try_agent1 | default('N/A') }}
      Verifique conectividade, GPG, ou repositórios do Zabbix.
  when: (_try_agent2 is failed) and (_try_agent1 is not defined or _try_agent1 is failed)

# -------------------------------------------------------------------
# (D) Descobrir unit real e iniciar serviço
# -------------------------------------------------------------------
- name: "SUSE | Descobrir unit do Zabbix Agent no systemd"
  ansible.builtin.shell: |
    set -o pipefail
    systemctl list-unit-files --no-pager | awk '{print $1}' | \
      grep -iE '^zabbix(-agent2|-agent|_agentd)\.service$' || true
  register: _zabbix_units
  changed_when: false
  failed_when: false

- name: "SUSE | Falhar se nenhum unit do Zabbix Agent for encontrado"
  ansible.builtin.fail:
    msg: >-
      Nenhum unit do Zabbix Agent encontrado no systemd.
      Units retornadas: {{ _zabbix_units.stdout_lines | default([]) }}
      (Mesmo após instalar pacote). Verifique a instalação/versão do pacote.
  when: (_zabbix_units.stdout_lines | default([]) | length) == 0

- name: "SUSE | Selecionar unit do Zabbix Agent"
  ansible.builtin.set_fact:
    _zabbix_unit_file: "{{ (_zabbix_units.stdout_lines | first) }}"

- name: "SUSE | Derivar nome do serviço a partir do unit"
  ansible.builtin.set_fact:
    _zabbix_service: "{{ _zabbix_unit_file | regex_replace('\\.service$', '') }}"

- name: "SUSE | Habilitar e iniciar Zabbix Agent"
  ansible.builtin.service:
    name: "{{ _zabbix_service }}"
    state: started
    enabled: yes
  become: yes
