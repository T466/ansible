---
- name: "Atualizar cache do APT"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600
  become: yes

- name: "Instalar Zabbix Agent em Ubuntu / Debian-like"
  ansible.builtin.apt:
    name: "{{ zabbix_agent_pkg_debian }}"
    state: present
  become: yes

- name: "Habilitar e iniciar Zabbix Agent no Debian-like"
  ansible.builtin.service:
    name: "{{ zabbix_agent_service_name }}"
    state: started
    enabled: yes
  become: yes
