
- name: Zookeeper | Aplicar ação (start/stop/restart)
  ansible.builtin.systemd:
    name: "{{ zookeeper_service_name }}"
    state: "{{ service_state }}"
  when: service_action in ['start', 'stop', 'restart']

- name: Zookeeper | Coletar status
  ansible.builtin.systemd:
    name: "{{ zookeeper_service_name }}"
  register: zk_status

- name: Zookeeper | Exibir status consolidado
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} | {{ zookeeper_service_name }}
      | active={{ zk_status.status.ActiveState | default('n/a') }}
      | sub={{ zk_status.status.SubState | default('n/a') }}
