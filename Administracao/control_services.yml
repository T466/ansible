- name: Controlar serviços Kafka e Zookeeper
  hosts: kafka_brokers:zookeeper_nodes   # ⬅️ evite 'all'
  become: true
  gather_facts: false

  vars:
    kafka_service_name: kafka
    zookeeper_service_name: zookeeper

  pre_tasks:
    - name: Validar variáveis do survey
      ansible.builtin.assert:
        that:
          - service_action in ['status','start','stop','restart']
          - service_target in ['kafka','zookeeper','both']
        fail_msg: "Survey inválido"

    - name: Mapear action -> state do systemd
      ansible.builtin.set_fact:
        systemd_state: "{{ {'start':'started','stop':'stopped','restart':'restarted'}[service_action] }}"
      when: service_action in ['start','stop','restart']

  tasks:
    # ✅ É AQUI QUE ENTRA O BLOCO 👇
    - name: Definir lista de serviços a operar (com ordem)
      ansible.builtin.set_fact:
        svc_list: >-
          {{
            (service_target == 'both') | ternary(
              (
                (service_action in ['start','restart'])
                | ternary([zookeeper_service_name, kafka_service_name],
                          [kafka_service_name, zookeeper_service_name])
              ),
              [ (service_target == 'kafka') | ternary(kafka_service_name, zookeeper_service_name) ]
            )
          }}

    - name: Executar ação nos serviços selecionados
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: "{{ systemd_state }}"
      loop: "{{ svc_list }}"
      when: service_action in ['start','stop','restart']

    - name: Coletar status dos serviços selecionados
      ansible.builtin.systemd:
        name: "{{ item }}"
      register: svc_status
      loop: "{{ svc_list }}"

    - name: Exibir status consolidado
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} | {{ item.name }}
          | active={{ item.status.ActiveState | default('n/a') }}
          | sub={{ item.status.SubState | default('n/a') }}
      loop: "{{ svc_status.results }}"
