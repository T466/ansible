---
# 1️⃣ Validação (1 vez só)
- name: Validar survey
  hosts: localhost
  gather_facts: false
  tasks:
    - ansible.builtin.assert:
        that:
          - service_action in ['status','start','stop','restart']
          - service_target in ['kafka','zookeeper','both']
      run_once: true

# 2️⃣ Zookeeper PRIMEIRO (start / restart)
- name: Zookeeper primeiro
  hosts: zookeeper_nodes
  become: true
  gather_facts: false
  vars:
    zk_state: "{{ 'started' if service_action == 'start' else 'restarted' }}"
  roles:
    - role: zookeeper_service
  when:
    - service_target in ['zookeeper','both']
    - service_action in ['start','restart']

# 3️⃣ Kafka DEPOIS (start / restart)
- name: Kafka depois
  hosts: kafka_brokers
  become: true
  gather_facts: false
  vars:
    kafka_state: "{{ 'started' if service_action == 'start' else 'restarted' }}"
  roles:
    - role: kafka_service
  when:
    - service_target in ['kafka','both']
    - service_action in ['start','restart']

# 4️⃣ Kafka PRIMEIRO (stop)
- name: Kafka primeiro (stop)
  hosts: kafka_brokers
  become: true
  gather_facts: false
  vars:
    kafka_state: stopped
  roles:
    - role: kafka_service
  when:
    - service_target in ['kafka','both']
    - service_action == 'stop'

# 5️⃣ Zookeeper POR ÚLTIMO (stop)
- name: Zookeeper por último (stop)
  hosts: zookeeper_nodes
  become: true
  gather_facts: false
  vars:
    zk_state: stopped
  roles:
    - role: zookeeper_service
  when:
    - service_target in ['zookeeper','both']
    - service_action == 'stop'
