- name: Provisionar novo broker Kafka
  hosts: new_kafka_node
  become: yes
  tasks:
    - name: Instalar Java e dependências
      ansible.builtin.yum:
        name:
          - java-11-openjdk
          - wget
        state: present

    - name: Baixar e instalar Kafka
      ansible.builtin.unarchive:
        src: "https://archive.apache.org/dist/kafka/{{ kafka_version }}/kafka_2.13-{{ kafka_version }}.tgz"
        dest: /opt
        remote_src: yes

    - name: Configurar Kafka
      ansible.builtin.template:
        src: server.properties.j2
        dest: /opt/kafka/config/server.properties

    - name: Iniciar Kafka
      ansible.builtin.systemd:
        name: kafka
        state: started
        enabled: yes
